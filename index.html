==<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级专属随机点名系统</title>
    <style>
        /* 炫酷流光渐变背景 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        。container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 50px 80px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        /* 名字显示大彩电 */
        #name-display {
            font-size: 5rem;
            color: #ffffff;
            font-weight: bold;
            height: 120px;
            line-height: 120px;
            margin: 40px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        /* 按钮样式 */
        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: #ffffff;
            color: #e73c7e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
            background: #fff0f5;
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* 烟花画布 */
        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="container">
        <h1>🎓 班级随机点名系统</h1>
        <div id="name-display">准备就绪</div>
        <button class="btn" id="start-btn" onclick="toggleRoll()">开始抽签</button>
    </div>

    <script>
        // 39位好听的虚拟学生名单
        const students = [
            "林梓萱","苏语桐","顾若溪","沈曼妮","江雨婷","谢诗涵","许佳怡","陈梦瑶",
            "谭若琳","钟欣怡","叶子涵","乔雨萱","袁诗琪","夏紫涵","周羽彤","范馨文",
            "戴诗怡","温舒婷","董若雨","梁晓溪","陆子聪","陆子枫","盛泽轩","唐宇轩",
            "薛慕白","萧逸枫","沈浩然","徐子骞","程宇航","崔俊杰","韩睿哲","高梓豪",
            "孙景源","卢思源","金宇航","罗浩轩","彭博文","何瑞霖","马子默"
        ];

        let timer = null;
        let isRolling = false;
        const display = document.getElementById('name-display');
        const btn = document.getElementById('start-btn');

        // 点名控制主逻辑
        function toggleRoll() {
            if (isRolling) {
                // 停止点名
                clearInterval(timer);
                isRolling = false;
                btn.innerText = "开始抽签";
                display.style.transform = "scale(1.15)"; // 中签名字放大特效
                
                // 触发全屏烟花
                initFireworks();
            } else {
                // 开始点名
                isRolling = true;
                btn.innerText = "就这位了！";
                display.style.transform = "scale(1.0)";
                clearFireworks();
                
                timer = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * students.length);
                    // 动态显示：学号 + 姓名
                    display.innerText = `第 ${randomIndex + 1} 号：${students[randomIndex]}`;
                }, 50); // 50毫秒闪烁一次
            }
        }

        /* ================= 烟花特效引擎 ================= */
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fireworkAnimation = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.04; // 重力加速度
                this.alpha -= this.decay;
            }
        }

        function createExplosion(x, y) {
            const colors = ['#FF1493', '#00FFFF', '#FFD700', '#00FF00', '#FF4500', '#9400D3'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 随机在空中不断产生新烟花
            if (Math.random() < 0.05 && particles.length < 300) {
                createExplosion(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6));
            }

            fireworkAnimation = requestAnimationFrame(animate);
        }

        function initFireworks() {
            resizeCanvas();
            // 在中央和两侧先炸三个大的
            createExplosion(canvas.width / 2, canvas.height / 3);
            createExplosion(canvas.width * 0.25, canvas.height / 2);
            createExplosion(canvas.width * 0.75, canvas.height / 2);
            animate();
        }

        function clearFireworks() {
            if (fireworkAnimation) cancelAnimationFrame(fireworkAnimation);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }
    </script>
</body>
</html>
