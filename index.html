<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级高级点名系统</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
        }

        。name-display-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        #id-display {
            font-size: 4rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Consolas', monospace;
            background: rgba(255,255,255,0.1);
            padding: 2px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
        }

        #name-display {
            font-size: 5.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            background: -webkit-linear-gradient(#fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: white;
            outline: none;
        }

        #btn-start {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        #btn-start:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,176,155,0.4); }
        
        #btn-stop {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        #btn-stop:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,65,108,0.4); }
        
        #btn-reset {
            background: linear-gradient(135deg, #4b6cb7, #182848);
        }

        #btn-reset:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(75,108,183,0.4); }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            opacity: 0.7;
        }

        。status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        。stats {
            font-size: 1.1rem;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 12px;
        }

        .history {
            width: 60%;
        }

        .history h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            opacity: 0.8;
        }

        #history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        #history-list li {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="glass-container">
        <div class="header">
            <h1>同心向美，感恩有你</h1>
            <h2>— 班级专属随机点名系统 —</h2>
        </div>

        <div class="name-display-box" id="display-box">
            <div id="id-display">01</div>
            <div id="name-display">准备就绪</div>
        </div>

        <div class="controls">
            <button id="btn-start">开始抽取</button>
            <button id="btn-stop" disabled>停止 !</button>
            <button id="btn-reset">重置名单</button>
        </div>

        <div class="status-bar">
            <div class="stats">
                剩余未点：<span id="remain-count">0</span> 人
            </div>
            <div class="history">
                <h3>已点名单：</h3>
                <ul id="history-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const originalNames = [
           "林梓萱"，"苏语桐","顾若溪","沈曼妮","江雨婷","谢诗涵","许佳怡","陈梦瑶",
"谭若琳","钟欣怡","叶子涵","乔雨萱","袁诗琪","夏紫涵","周羽彤","范馨文",
"戴诗怡","温舒婷","董若雨","梁晓溪","陆子聪","陆子枫","盛泽轩","唐宇轩",
"薛慕白","萧逸枫","沈浩然","徐子骞","程宇航","崔俊杰","韩睿哲","高梓豪",
"孙景源","卢思源","金宇航","罗浩轩","彭博文","何瑞霖","马子默"
        ];
        const studentList = originalNames.map((name, index) => ({
            id: String(index + 1).padStart(2, '0'),
            name: name
        }));

        let currentStudents = [...studentList];
        let calledStudents = [];
        let timer = null;
        let isRunning = false;
        let selectedStudent = null;

        const idEl = document.getElementById('id-display');
        const displayEl = document.getElementById('name-display');
        const displayBox = document.getElementById('display-box');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        const remainCountEl = document.getElementById('remain-count');
        const historyListEl = document.getElementById('history-list');

        function init() {
            remainCountEl.innerText = currentStudents.length;
        }
        init();

        function getRandomStudent() {
            const randomIndex = Math.floor(Math.random() * currentStudents.length);
            return currentStudents[randomIndex];
        }

        btnStart.addEventListener('click', () => {
            if (currentStudents.length === 0) {
                alert("所有同学都已点过名啦，请点击重置名单！");
                return;
            }
            isRunning = true;
            btnStart.disabled = true;
            btnStop.disabled = false;
            idEl。style.display = "block";
            
            displayBox.style.transform = "scale(0.98)";
            
            timer = setInterval(() => {
                selectedStudent = getRandomStudent();
                idEl.innerText = selectedStudent.id;
                displayEl.innerText = selectedStudent.name;
            }， 50);
        });

        btnStop.addEventListener('click', () => {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timer);
            
            btnStart.disabled = false;
            btnStop.disabled = true;
            displayBox.style.transform = "scale(1)";

            const nameIndex = currentStudents.findIndex(s => s.id === selectedStudent.id);
            if (nameIndex > -1) {
                currentStudents.splice(nameIndex, 1);
            }
            
            calledStudents.push(selectedStudent);
            updateStatus();
            
            fireConfetti();
        });

        btnReset.addEventListener('click', () => {
            if (confirm("确定要重置并清空已点名录吗？")) {
                clearInterval(timer);
                currentStudents = [...studentList];
                calledStudents = [];
                idEl.style.display = "none";
                displayEl.innerText = "准备就绪";
                selectedStudent = null;
                btnStart.disabled = false;
                btnStop.disabled = true;
                isRunning = false;
                updateStatus();
            }
        });

        function updateStatus() {
            remainCountEl.innerText = currentStudents.length;
            historyListEl.innerHTML = '';
            calledStudents.forEach(student => {
                const li = document.createElement('li');
                li.innerText = `${student.id}号 ${student.name}`;
                historyListEl.appendChild(li);
            });
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff4b2b', '#ff416c', '#00b09b', '#96c93d', '#f7b733', '#fc4a1a'];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 12 - 6;
                this.speedY = Math.random() * -15 - 5;
                this.gravity = 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.life = 100;
            }
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.life -= 1;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 100;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function fireConfetti() {
            const x = canvas.width / 2;
            const y = canvas.height / 2 - 100;
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(x, y));
            }
            animateConfetti();
        }
    </script>
</body>
</html>
