name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview Pillow

    - name: Auto Fix Icon Format
      shell: python
      run: |
        import os
        from PIL import Image
        if os.path.exists('icon.png'):
            img = Image.open('icon.png')
            img.save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32)])

    - name: Build with PyInstaller
      shell: cmd
      run: |
        if exist icon.ico (
            pyinstaller --noconsole --onefile --add-data "index.html;." --icon="icon.ico" main.py
        ) else (
            pyinstaller --noconsole --onefile --add-data "index.html;." main.py
        )

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Class-Roll-Call-EXE
        path: dist/main.exe
